   the artifact store. Tokens are taken from the portfolio design system (cyan

   dark-first, so bare :root carries dark and the light palette arrives by media
   query or an explicit stamp. */
:root {
  color-scheme: dark;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-base: 0.9375rem;
  --fs-md: 1rem;
  --fs-lg: clamp(1.0625rem, 0.4vw + 0.98rem, 1.1875rem);

  --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem; --sp-4: 1rem;

  --nav-h: 60px;
  --radius-sm: 8px;

  --bg: #0a0b0d;
  --bg-elev: #111318;
  --bg-elev-2: #171a21;
  --bg-inset: rgba(255, 255, 255, 0.03);
  --text: #e9edf2;
  --text-muted: #98a2b0;

  --accent: #22d3ee;
  --accent-soft: rgba(34, 211, 238, 0.13);

  --accent-contrast: #04191d;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);

<script>
(function () {
"use strict";

/* ===================== engine (mirrors src/engine.js) ===================== */

var LOCKS = {
  "ACCESS EXCLUSIVE":      { rank: 8, blocks: "everything, including SELECT", note: "Nothing can read or write the table while this is held." },
  "SHARE ROW EXCLUSIVE":   { rank: 6, blocks: "all writes and other schema changes", note: "Reads continue. INSERT, UPDATE and DELETE wait." },
  "SHARE":                 { rank: 5, blocks: "all writes", note: "Reads continue. Writes wait for the whole build." },
  "SHARE UPDATE EXCLUSIVE":{ rank: 4, blocks: "other schema changes and VACUUM", note: "Reads and writes both continue normally." },
  "ROW EXCLUSIVE":         { rank: 3, blocks: "nothing that matters here", note: "The ordinary write lock." },
  "ACCESS SHARE":          { rank: 1, blocks: "nothing", note: "The ordinary read lock." }
};

function splitStatements(sql) {
  var out = [], buf = "", line = 1, startLine = 1, i = 0;
  function push() {
    var text = buf.trim();
    if (text) {
      var lead = buf.match(/^\s*/)[0];
      out.push({ sql: text, line: startLine + (lead.match(/\n/g) || []).length });
    }
    buf = ""; startLine = line;
  }
  while (i < sql.length) {
    var c = sql[i], n2 = sql.slice(i, i + 2);

      inTxn = false; acc = []; return;
    }
    if (inTxn && s.lock && LOCKS[s.lock].rank >= 5) acc.push(s.op);
  });

  var worst = statements.reduce(function (a, s) { return SEV[s.severity] > SEV[a] ? s.severity : a; }, "safe");
  var sw = script.reduce(function (a, f) { return SEV[f.severity] > SEV[a] ? f.severity : a; }, "safe");
  var overall = SEV[sw] > SEV[worst] ? sw : worst;
  var blocking = statements.filter(function (s) { return s.lock && LOCKS[s.lock].rank >= 5; });
  var blockedSeconds = blocking.reduce(function (a, s) { return a + (s.seconds || 0); }, 0);

  return { rows: rows, statements: statements, script: script, verdict: overall,
    blockingCount: blocking.length, blockedSeconds: blockedSeconds, blockedFor: describeDuration(blockedSeconds || null),
    worstLock: blocking.reduce(function (a, s) { return !a || LOCKS[s.lock].rank > LOCKS[a].rank ? s.lock : a; }, null) };
}

var state = {
  ready: false,
  db: null,
  user: null,
  canWrite: null,
  reviews: [],
  tables: [],
  loadingReviews: true,
  loadingTables: true,
  filter: "all",
  search: "",
  draft: { title: "", sql: "", table: "", rows: 1000000 },
  persistent: false
};

var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function toast(msg) {
  var el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove("on"); }, 2800);
}
function relTime(ms) {
  if (!ms) return "—";
  var d = Date.now() - ms, m = Math.round(d / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  var h = Math.round(m / 60);
  if (h < 24) return h + "h ago";
  var dd = Math.round(h / 24);
  if (dd < 30) return dd + "d ago";
  return new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
function fmtRows(n) { return Number(n || 0).toLocaleString("en-US"); }
function uid() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

var VERDICT_LABEL = { critical: "Do not run", high: "Risky", medium: "Check order", low: "Mostly fine", safe: "Safe" };

/* ============================== persistence ============================= */

function localKey() { return "lockqueue.local.v1"; }
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(localKey()) || "{}"); } catch (e) { return {}; }
}
function saveLocal() {
  if (state.persistent) return;
  try {
    localStorage.setItem(localKey(), JSON.stringify({ reviews: state.reviews, tables: state.tables }));
  } catch (e) { /* private window, blocked storage — the page still works */ }
}

async function connect() {
  var db = null, user = null;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  try { user = await window.claude?.use?.("user"); } catch (e) { user = null; }

  state.db = db || null;
  state.user = user || null;
  state.persistent = !!db;

  if (user) {
    try { state.canWrite = await user.can("data.write"); } catch (e) { state.canWrite = null; }
  }

  if (!db) {
    // Design for absence: run against local storage so the tool still works.
    var local = loadLocal();
    state.reviews = local.reviews || [];
    state.tables = local.tables || [];
    state.loadingReviews = false;
    state.loadingTables = false;
    state.ready = true;
    renderWho();
    render();
    return;
  }

  state.ready = true;
  renderWho();

  // Subscribe once each, never from render.
  db.collection("reviews").orderBy("createdAt", "desc").limit(200).onSnapshot(
    function (snap) {
      state.reviews = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.loadingReviews = false;
      render();
    },
    function (err) {
      state.loadingReviews = false;
      toast("Could not load reviews (" + err.code + ")");
      render();
    }
  );

  db.collection("tables").orderBy("name", "asc").limit(200).onSnapshot(
    function (snap) {
      state.tables = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.loadingTables = false;
      render();
    },
    function (err) {
      state.loadingTables = false;
      render();
    }
  );
}

async function saveReview(doc) {
  if (!state.db) {
    state.reviews = [doc].concat(state.reviews.filter(function (r) { return r.id !== doc.id; }));
    saveLocal(); render(); return true;
  }
  try {
    var body = Object.assign({}, doc); delete body.id;
    await state.db.collection("reviews").doc(doc.id).set(body);
    return true;
  } catch (err) {
    if (err && err.code === "invalid_argument") {
      state.canWrite = false;
      toast("This view is read-only, so nothing was saved.");
    } else {
      toast("Could not save (" + (err && err.code ? err.code : "unknown") + ")");
    }
    render();
    return false;
  }
}

async function patchReview(id, patch) {
  if (!state.db) {
    state.reviews = state.reviews.map(function (r) { return r.id === id ? Object.assign({}, r, patch) : r; });
    saveLocal(); render(); return;
  }
  try { await state.db.collection("reviews").doc(id).update(patch); }
  catch (err) { toast("Could not update (" + (err && err.code ? err.code : "unknown") + ")"); }
}

async function removeReview(id) {
  if (!state.db) {
    state.reviews = state.reviews.filter(function (r) { return r.id !== id; });
    saveLocal(); render(); return;
  }
  try { await state.db.collection("reviews").doc(id).delete(); }
  catch (err) { toast("Could not delete (" + (err && err.code ? err.code : "unknown") + ")"); }
}

async function saveTable(doc) {
  if (!state.db) {
    state.tables = state.tables.filter(function (t) { return t.id !== doc.id; }).concat([doc])
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
    saveLocal(); render(); return;
  }
  try {
    var body = { name: doc.name, rows: doc.rows, updatedAt: Date.now() };
    await state.db.collection("tables").doc(doc.id).set(body);
  } catch (err) { toast("Could not save table (" + (err && err.code ? err.code : "unknown") + ")"); }
}

async function removeTable(id) {
  if (!state.db) {
    state.tables = state.tables.filter(function (t) { return t.id !== id; });
    saveLocal(); render(); return;
  }
  try { await state.db.collection("tables").doc(id).delete(); }
  catch (err) { toast("Could not delete table (" + (err && err.code ? err.code : "unknown") + ")"); }
}

function readOnly() { return state.canWrite === false; }

/* ================================ views ================================ */

function renderWho() {

    dot.className = "dot dot--off";

}

function statsFor(reviews) {
  var open = reviews.filter(function (r) { return r.status === "open"; });
  var risky = reviews.filter(function (r) { return r.verdict === "critical" || r.verdict === "high"; });
  var avoided = reviews
    .filter(function (r) { return r.status === "shipped"; })
    .reduce(function (a, r) { return a + (r.blockedSeconds || 0); }, 0);
  return { total: reviews.length, open: open.length, risky: risky.length, avoided: avoided };
}

  var s = statsFor(state.reviews);
  var filtered = state.reviews.filter(function (r) {

  });

  var body;
  if (state.loadingReviews) {
    body = '<div class="rows">' +

  } else if (!state.reviews.length) {
    body = '<div class="state">' +

      '<a class="btn btn--primary" href="#/new">Review a migration</a></div>';
  } else if (!filtered.length) {
    body = '<div class="state"><h3>Nothing matches</h3><p>No review matches that filter and search. Clear them to see all ' + state.reviews.length + '.</p>' +
      '<button class="btn" type="button" data-act="clear-filters">Clear filters</button></div>';
  } else {
    body = '<div class="rows">' + filtered.map(function (r) {
      return '<article class="card row-card" data-act="open" data-id="' + esc(r.id) + '" tabindex="0" role="link" aria-label="Open review ' + esc(r.title) + '">' +
        '<div class="row-card__main">' +
          '<div class="row-card__title"><h3>' + esc(r.title || "Untitled migration") + "</h3>" +
            '<span class="pill pill--' + esc(r.verdict) + '">' + esc(VERDICT_LABEL[r.verdict] || r.verdict) + "</span></div>" +
          '<div class="row-card__meta">' +
            "<span>" + esc(r.tableName || "no table set") + "</span>" +
            "<span>" + fmtRows(r.rows) + " rows</span>" +

          "</div>" +
        "</div>" +
        '<div class="row-card__right"><span class="pill pill--' + esc(r.status || "open") + '">' + esc(r.status || "open") + "</span></div>" +
      "</article>";

  }

  return '<div class="page">' +
    '<div class="page__head"><div>' +
      '<p class="eyebrow">Migration safety</p>' +
      '<h1 class="page__title">Reviews</h1>' +

    "</div>" +
    '<a class="btn btn--primary" href="#/new">New review</a></div>' +

    (state.persistent ? "" :
      '<div class="banner"><strong>Saved on this device only.</strong> Sign in to the workspace to sync reviews across devices and with your team.</div>') +
    (readOnly() ? '<div class="banner"><strong>Read-only access.</strong> You can review migrations, but saving is disabled for your role.</div>' : "") +

    '<div class="stats">' +
      '<div class="card stat"><span class="stat__value">' + s.total + '</span><span class="stat__label">Reviews</span><span class="stat__detail">Migrations checked in this workspace</span></div>' +
      '<div class="card stat"><span class="stat__value">' + s.open + '</span><span class="stat__label">Open</span><span class="stat__detail">Reviewed but not yet shipped or dismissed</span></div>' +
      '<div class="card stat"><span class="stat__value">' + s.risky + '</span><span class="stat__label">Flagged risky</span><span class="stat__detail">Verdict of risky or do-not-run</span></div>' +
      '<div class="card stat"><span class="stat__value">' +
        (s.avoided > 0 ? describeDuration(s.avoided).replace("about ", "") : "&mdash;") +
        '</span><span class="stat__label">Blocking avoided</span><span class="stat__detail">Across shipped reviews, had they run as written</span></div>' +
    "</div>" +

    '<div class="toolbar">' +

}

/* ================================ router ================================ */

function route() {
  var h = location.hash || "#/reviews";
  var m = h.match(/^#\/review\/(.+)$/);
  if (m) return { name: "detail", id: decodeURIComponent(m[1]) };
  if (h.indexOf("#/new") === 0) return { name: "new" };
  if (h.indexOf("#/tables") === 0) return { name: "tables" };
  return { name: "reviews" };
}

function render() {
  var r = route();
  var html;
  if (r.name === "new") html = viewNew();
  else if (r.name === "tables") html = viewTables();
  else if (r.name === "detail") html = viewDetail(r.id);
  else html = viewReviews();

  $("#main").innerHTML = html;

  var active = r.name === "detail" ? "reviews" : r.name;
  Array.prototype.forEach.call(document.querySelectorAll(".nav__link"), function (a) {
    if (a.dataset.view === active) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  renderWho();
}

/* ================================ events ================================ */

window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "search") { state.search = t.value; var p = t.selectionStart; render(); var el = $("#search"); if (el) { el.focus(); el.setSelectionRange(p, p); } return; }
  if (t.id === "title") { state.draft.title = t.value; return; }
  if (t.id === "rows") { state.draft.rows = t.value; schedulePreview(); return; }
  if (t.id === "sql") { state.draft.sql = t.value; schedulePreview(); return; }
});

var previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(function () {
    if (route().name !== "new") return;
    var sqlEl = $("#sql"), pos = sqlEl ? sqlEl.selectionStart : null, focused = document.activeElement && document.activeElement.id;
    render();
    if (focused) {
      var again = document.getElementById(focused);
      if (again) { again.focus(); if (pos !== null && again.setSelectionRange && again.type !== "number") again.setSelectionRange(pos, pos); }
    }
  }, 220);
}

document.addEventListener("change", function (ev) {
  if (ev.target.id === "table") {
    var id = ev.target.value;
    state.draft.table = id;
    var t = state.tables.filter(function (x) { return x.id === id; })[0];
    if (t) state.draft.rows = t.rows;
    render();
  }
});

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var act = el.dataset.act;

  if (act === "filter") { state.filter = el.dataset.filter; render(); return; }
  if (act === "clear-filters") { state.filter = "all"; state.search = ""; render(); return; }
  if (act === "open") { location.hash = "#/review/" + encodeURIComponent(el.dataset.id); return; }

  if (act === "copy") { copy(el.dataset.copy); return; }

  if (act === "save-review") { doSaveReview(); return; }

  if (act === "status") {
    patchReview(el.dataset.id, { status: el.dataset.status });
    toast("Marked " + el.dataset.status + ".");
    return;
  }

  if (act === "delete") {
    if (el.dataset.confirm === "1") { removeReview(el.dataset.id); location.hash = "#/reviews"; toast("Review deleted."); return; }
    el.dataset.confirm = "1";
    el.textContent = "Click again to delete";
    setTimeout(function () { if (el.isConnected) { el.dataset.confirm = ""; el.textContent = "Delete"; } }, 4000);
    return;
  }

  if (act === "copy-safe") {
    var r = state.reviews.filter(function (x) { return x.id === el.dataset.id; })[0];
    if (r) copy(safeScript(r), "Safe migration copied.");
    return;
  }

  if (act === "add-table") {
    var name = ($("#t-name") || {}).value, rows = Number(($("#t-rows") || {}).value);
    if (!name || !name.trim()) { toast("Give the table a name."); return; }
    if (!isFinite(rows) || rows < 0) { toast("Row count must be a number."); return; }
    saveTable({ id: name.trim().replace(/[^A-Za-z0-9_.~:@+-]/g, "_"), name: name.trim(), rows: rows, updatedAt: Date.now() });
    toast("Table saved.");
    return;
  }

  if (act === "del-table") { removeTable(el.dataset.id); toast("Table removed."); return; }
});

document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  var el = ev.target.closest('[data-act="open"]');
  if (!el) return;
  ev.preventDefault();
  location.hash = "#/review/" + encodeURIComponent(el.dataset.id);
});

async function doSaveReview() {
  var d = state.draft;
  if (!d.sql.trim()) { toast("Paste a migration first."); return; }
  var rows = Number(d.rows) || 0;
  var result = analyze(d.sql, { rows: rows });
  var t = state.tables.filter(function (x) { return x.id === d.table; })[0];

  var doc = {
    id: uid(),
    title: d.title.trim() || (result.statements[0] ? result.statements[0].op : "Migration"),
    sql: d.sql,
    tableName: t ? t.name : (result.statements.map(function (s) { return s.table; }).filter(Boolean)[0] || ""),
    rows: rows,
    verdict: result.verdict,
    blockedSeconds: result.blockedSeconds,
    blockedFor: result.blockedFor,
    blockingCount: result.blockingCount,
    statementCount: result.statements.length,
    status: "open",
    createdAt: Date.now()
  };

  var okSave = await saveReview(doc);
  if (okSave === false) return;
  state.draft = { title: "", sql: "", table: "", rows: rows };
  toast("Review saved.");
  location.hash = "#/review/" + encodeURIComponent(doc.id);
}

function safeScript(r) {
  var result = analyze(r.sql || "", { rows: Number(r.rows) || 0 });
  var out = ["-- Rewritten by Lock Queue.",
             "-- Statements with a safer equivalent were replaced; the rest are unchanged.",
             "-- CONCURRENTLY statements must run outside any transaction block.", ""];
  if (!result.statements.some(function (s) { return s.op === "SET lock_timeout"; })) {
    out.push("SET lock_timeout = '3s';", "SET statement_timeout = '30s';", "");
  }
  result.statements.forEach(function (s) {
    if (s.op === "BEGIN" || s.op === "COMMIT" || s.op === "ROLLBACK") return;
    if (s.fix) { out.push("-- was: " + s.raw.split("\n")[0].slice(0, 70)); out.push(s.fix.sql, ""); }
    else out.push(s.raw.replace(/;?\s*$/, "") + ";", "");
  });
  return out.join("\n");
}

function copy(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { toast(msg || "Copied."); },
      function () { toast("Copy blocked here — select the text instead."); }
    );
  } else toast("Copy blocked here — select the text instead.");
}

/* ================================= boot ================================= */

render();          // first paint: designed loading state, before any capability answers
connect();
})();
</script>
